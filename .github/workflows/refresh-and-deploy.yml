name: Refresh KOSPI200 dashboard

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "실행할 수집 작업"
        required: true
        default: all
        type: choice
        options:
          - all
          - news
          - valuation
  schedule:
    - cron: "0 3 * * *"
    - cron: "40 6 * * *"
    - cron: "5 3 * * 1"
    - cron: "10 3 1 * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: kospi200-dashboard-refresh
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout dashboard
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install data dependencies
        run: python -m pip install --disable-pip-version-check pandas lxml

      - name: Choose scheduled mode
        id: mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            mode="${{ inputs.mode }}"
          elif [[ "${{ github.event.schedule }}" == "0 3 * * *" || "${{ github.event.schedule }}" == "40 6 * * *" ]]; then
            mode="news"
          else
            mode="valuation"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Selected refresh mode: $mode"

      - name: Refresh public data and news
        run: >-
          python refresh_research.py
          --mode "${{ steps.mode.outputs.mode }}"
          --universe kospi200_universe.csv
          --output-dir .
          --delay 1.2
          --history-count 0

      - name: Preserve previous valuation data on total failure
        if: steps.mode.outputs.mode == 'valuation' || steps.mode.outputs.mode == 'all'
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import pathlib
          import subprocess

          path = pathlib.Path("public_financials.csv")
          rows = list(csv.DictReader(path.open(encoding="utf-8-sig", newline=""))) if path.exists() else []
          valid = sum(
              1 for row in rows
              if row.get("quality_flag") == "OK"
              and any(row.get(key) not in ("", None) for key in ("close", "trailing_per", "current_pbr"))
          )
          print(f"Valuation rows: {len(rows)}, valid rows: {valid}")
          if rows and valid == 0:
              print("All valuation rows failed; restoring the previous committed valuation files.")
              for name in ("valuation_data.json", "public_financials.csv", "price_history.csv"):
                  subprocess.run(["git", "checkout", "HEAD", "--", name], check=False)
          PY

      - name: Commit refreshed JSON and audit files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add valuation_data.json news_data.json
          [[ -f public_financials.csv ]] && git add public_financials.csv || true
          [[ -f price_history.csv ]] && git add price_history.csv || true
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: refresh KOSPI200 dashboard data"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
